services:
  postgres:
    image: postgres:16-alpine
    container_name: kdp-bookforge-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: kdp_bookforge
    ports:
      - "5432:5432"
    volumes:
      - kdp_bookforge_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  kdp_bookforge_pgdata:
